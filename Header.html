<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Cairo','Segoe UI',sans-serif;text-align:center;padding:20px;min-height:100vh;transition:0.3s}
body.en{direction:ltr;font-family:'Segoe UI',Arial}
.lang-btn{position:absolute;top:20px;left:20px;background:#ff3333;border:none;color:#fff;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px;z-index:999}
.logo{font-size:48px;font-weight:bold;margin:40px 0 20px;letter-spacing:3px}
.logo span{color:#ff3333}
.ar,.en{display:inline}
body.en .ar{display:none}
body:not(.en) .en{display:none}
</style>
<script>
function toggleLang(){
document.body.classList.toggle('en');
document.documentElement.dir=document.body.classList.contains('en')?'ltr':'rtl';
document.documentElement.lang=document.body.classList.contains('en')?'en':'ar';
localStorage.setItem('lang',document.body.classList.contains('en')?'en':'ar');
}
window.onload=function(){if(localStorage.getItem('lang')==='en')document.body.classList.add('en')}
</script>
