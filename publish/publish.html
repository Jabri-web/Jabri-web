<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>واحة الجبري</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f4f0e9;
            font-family: 'Arial', sans-serif;
            direction: rtl;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border-top: 6px solid #8b0000;
        }
        h2 {
            color: #8b0000;
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            color: #333;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 5px 0 15px 0;
            border: 2px solid #e0d6c8;
            border-radius: 10px;
            font-size: 16px;
            background: #fcfaf7;
        }
        input:focus, textarea:focus {
            border-color: #8b0000;
            outline: none;
        }
        textarea { min-height: 120px; resize: vertical; }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            color: white;
        }
        .btn-primary { background: #8b0000; }
        .btn-secondary { background: #2c3e50; }
        .btn-success { background: #27ae60; }
        #status {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            display: none;
            white-space: pre-wrap;
        }
        #status.show { display: block; }
        #status.success { background: #e6f7e6; color: #2d7a2d; }
        #status.error { background: #fde8e8; color: #8b0000; }
        #status.loading { background: #f0f0f0; color: #555; }
        .share-buttons {
            display: none;
            margin-top: 15px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .share-buttons.show { display: flex; }
        .share-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }
        .share-btn.whatsapp { background: #25D366; }
        .share-btn.twitter { background: #1DA1F2; }
        .share-btn.copy { background: #6c757d; }
        .post-list {
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .post-item {
            background: #f9f6f0;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-right: 4px solid #8b0000;
        }
        .post-item h4 { color: #8b0000; margin-bottom: 5px; }
        .post-item small { color: #888; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h2>✍️ واحة الجبري</h2>
    
    <form id="publishForm">
        <label>العنوان</label>
        <input type="text" id="title" placeholder="اكتب عنوان المنشور..." required>
        <label>المحتوى</label>
        <textarea id="content" placeholder="اكتب نص المنشور..." required></textarea>
        <div class="btn-group">
            <button type="submit" class="btn btn-primary">📤 نشر</button>
            <button type="button" id="listBtn" class="btn btn-secondary">📂 المنشورات</button>
            <button type="button" id="clearBtn" class="btn btn-success">🗑️ حذف الكل</button>
        </div>
    </form>
    
    <div id="status"></div>
    
    <div class="share-buttons" id="shareOptions">
        <button class="share-btn whatsapp" onclick="shareTo('whatsapp')">📱 واتساب</button>
        <button class="share-btn twitter" onclick="shareTo('twitter')">🐦 تويتر</button>
        <button class="share-btn copy" onclick="shareTo('copy')">📋 نسخ</button>
    </div>
    
    <div class="post-list" id="postList"></div>
</div>

<script>
    // === دوال التخزين المحلي ===
    function getPosts() {
        return JSON.parse(localStorage.getItem('posts') || '[]');
    }
    
    function savePosts(posts) {
        localStorage.setItem('posts', JSON.stringify(posts));
    }
    
    function addPost(title, content) {
        const posts = getPosts();
        posts.unshift({ 
            title, 
            content, 
            date: new Date().toLocaleString('ar-EG'),
            id: Date.now()
        });
        savePosts(posts);
        return posts;
    }
    
    function deleteAllPosts() {
        savePosts([]);
    }
    
    // === عرض المنشورات ===
    function displayPosts() {
        const posts = getPosts();
        const container = document.getElementById('postList');
        if (posts.length === 0) {
            container.innerHTML = '<p style="color:#888;text-align:center;">📭 لا توجد منشورات</p>';
            return;
        }
        container.innerHTML = posts.map(p => `
            <div class="post-item">
                <h4>📌 ${p.title}</h4>
                <p>${p.content}</p>
                <small>🕐 ${p.date}</small>
            </div>
        `).join('');
    }
    
    // === حالة الرسائل ===
    function setStatus(msg, type = 'success') {
        const div = document.getElementById('status');
        div.textContent = msg;
        div.className = 'show ' + type;
        setTimeout(() => div.className = '', 5000);
    }
    
    // === أزرار ===
    document.getElementById('listBtn').addEventListener('click', () => {
        displayPosts();
        const posts = getPosts();
        setStatus(`📂 ${posts.length} منشور محفوظ`, 'success');
    });
    
    document.getElementById('clearBtn').addEventListener('click', () => {
        if (confirm('⚠️ هل أنت متأكد من حذف جميع المنشورات؟')) {
            deleteAllPosts();
            displayPosts();
            setStatus('🗑️ تم حذف جميع المنشورات', 'error');
            document.getElementById('shareOptions').classList.remove('show');
        }
    });
    
    // === نشر منشور جديد ===
    document.getElementById('publishForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();
        if (!title || !content) {
            setStatus('⚠️ الرجاء ملء جميع الحقول', 'error');
            return;
        }
        
        addPost(title, content);
        setStatus('✅ تم النشر وحفظه بنجاح!', 'success');
        document.getElementById('shareOptions').classList.add('show');
        document.getElementById('title').value = '';
        document.getElementById('content').value = '';
        displayPosts();
    });
    
    // === مشاركة ===
    window.shareTo = function(platform) {
        const posts = getPosts();
        if (posts.length === 0) {
            alert('⚠️ لا يوجد منشورات للمشاركة');
            return;
        }
        const latest = posts[0];
        const text = `${latest.title}\n\n${latest.content}\n\n#عبدالله_الجبري #فلسطين_عربية`;
        const url = 'https://jabri-com.vercel.app';
        
        if (platform === 'whatsapp') {
            window.open(`https://wa.me/?text=${encodeURIComponent(text + '\n' + url)}`, '_blank');
        } else if (platform === 'twitter') {
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
        } else if (platform === 'copy') {
            navigator.clipboard.writeText(text + '\n' + url);
            alert('✅ تم نسخ النص');
        }
    };
    
    // === تحميل أولي ===
    displayPosts();
    
    // === تسجيل Service Worker (للتشغيل بدون إنترنت) ===
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
