<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشر منشور جديد | واحة الجبري</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #f4f0e9;
            font-family: 'Arial', sans-serif;
            direction: rtl;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-top: 6px solid #8b0000;
        }
        h2 {
            color: #8b0000;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }
        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-top: 10px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 2px solid #e0d6c8;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            background: #fcfaf7;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #8b0000;
            outline: none;
            background: #fff;
        }
        textarea {
            resize: vertical;
            min-height: 150px;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: #8b0000;
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s, transform 0.1s;
            flex: 1;
            justify-content: center;
        }
        .btn-primary:hover {
            background: #a00000;
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-secondary {
            background: #2c3e50;
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s, transform 0.1s;
            flex: 1;
            justify-content: center;
        }
        .btn-secondary:hover {
            background: #1a2a3a;
        }
        .btn-secondary:active {
            transform: scale(0.97);
        }
        #status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        #status.show {
            display: block;
        }
        #status.success {
            background: #e6f7e6;
            color: #2d7a2d;
            border: 1px solid #a3d8a3;
        }
        #status.error {
            background: #fde8e8;
            color: #8b0000;
            border: 1px solid #f5c6c6;
        }
        #status.loading {
            background: #f0f0f0;
            color: #555;
            border: 1px solid #ddd;
        }
        #previewArea {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f9f6f0;
            border-radius: 12px;
            border-right: 6px solid #8b0000;
        }
        #previewArea.show {
            display: block;
        }
        #previewArea h3 {
            margin-top: 0;
            color: #8b0000;
        }
        #previewArea .post-meta {
            font-size: 14px;
            color: #777;
            border-top: 1px solid #e0d6c8;
            padding-top: 10px;
            margin-top: 10px;
        }
        #viewPostLink {
            margin-top: 15px;
            text-align: center;
        }
        #viewPostLink a {
            color: #8b0000;
            font-weight: bold;
            text-decoration: none;
            border: 2px solid #8b0000;
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            transition: background 0.3s, color 0.3s;
        }
        #viewPostLink a:hover {
            background: #8b0000;
            color: white;
        }
        #shareOptions {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #f9f6f0;
            border-radius: 12px;
            border: 2px solid #8b0000;
        }
        #shareOptions.show {
            display: block;
        }
        #shareOptions h4 {
            margin-top: 0;
            color: #8b0000;
        }
        .share-btn {
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 14px;
            transition: transform 0.2s;
        }
        .share-btn:hover {
            transform: scale(1.05);
        }
        .share-btn.whatsapp { background: #25D366; }
        .share-btn.twitter { background: #1DA1F2; }
        .share-btn.facebook { background: #1877F2; }
        .share-btn.telegram { background: #0088cc; }
        .share-btn.copy { background: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <h2>✍️ نشر منشور جديد</h2>

    <form id="publishForm">
        <label for="title">العنوان</label>
        <input type="text" id="title" placeholder="اكتب عنوان المنشور..." required>

        <label for="content">المحتوى</label>
        <textarea id="content" rows="8" placeholder="اكتب نص المنشور هنا..." required></textarea>

        <div class="button-group">
            <button type="submit" class="btn-primary">📤 نشر</button>
            <button type="button" id="previewBtn" class="btn-secondary">👁️ عرض</button>
            <button type="button" id="listBtn" class="btn-secondary">📂 المنشورات</button>
        </div>
    </form>

    <div id="status"></div>

    <div id="shareOptions">
        <h4>🌐 اختر منصة النشر:</h4>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;">
            <button class="share-btn whatsapp" onclick="shareTo('whatsapp')">📱 واتساب</button>
            <button class="share-btn twitter" onclick="shareTo('twitter')">🐦 تويتر</button>
            <button class="share-btn facebook" onclick="shareTo('facebook')">📘 فيسبوك</button>
            <button class="share-btn telegram" onclick="shareTo('telegram')">✈️ تيليجرام</button>
            <button class="share-btn copy" onclick="shareTo('copy')">📋 نسخ الرابط</button>
        </div>
    </div>

    <div id="previewArea">
        <h3>📄 معاينة المنشور</h3>
        <div id="previewContent"></div>
        <div class="post-meta">
            #عبدالله_الجبري (صنعاء-اليمن)<br>
            <span id="previewDate"></span>
        </div>
    </div>

    <div id="viewPostLink"></div>
</div>

<script>
    (function() {
        // === عناصر DOM ===
        const form = document.getElementById('publishForm');
        const titleInput = document.getElementById('title');
        const contentInput = document.getElementById('content');
        const statusDiv = document.getElementById('status');
        const previewArea = document.getElementById('previewArea');
        const previewContent = document.getElementById('previewContent');
        const previewDate = document.getElementById('previewDate');
        const viewPostLink = document.getElementById('viewPostLink');
        const shareOptions = document.getElementById('shareOptions');

        // === دالة عرض الحالة ===
        function setStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'show ' + type;
        }

        // === دالة عرض المعاينة ===
        function showPreview() {
            const title = titleInput.value.trim() || 'بدون عنوان';
            const content = contentInput.value.trim() || '...';
            const now = new Date();
            const dateStr = now.toLocaleDateString('ar-EG', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            previewContent.innerHTML = `
                <h4>${title}</h4>
                <p style="white-space: pre-wrap; line-height: 1.8;">${content}</p>
            `;
            previewDate.textContent = `- ${dateStr}`;
            previewArea.classList.add('show');
            viewPostLink.innerHTML = '';
        }

        // === دالة المشاركة (عامة) ===
        window.shareTo = function(platform) {
            const title = titleInput.value.trim() || 'منشور';
            const content = contentInput.value.trim() || '';
            const url = 'https://jabri-com.vercel.app';
            const text = `${title}\n\n${content}\n\n#عبدالله_الجبري #فلسطين_عربية`;

            let shareUrl = '';
            switch (platform) {
                case 'whatsapp':
                    shareUrl = `https://wa.me/?text=${encodeURIComponent(text + '\n' + url)}`;
                    break;
                case 'twitter':
                    shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
                    break;
                case 'facebook':
                    shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}&quote=${encodeURIComponent(text)}`;
                    break;
                case 'telegram':
                    shareUrl = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
                    break;
                case 'copy':
                    navigator.clipboard.writeText(text + '\n' + url)
                        .then(() => alert('✅ تم نسخ النص والرابط!'))
                        .catch(() => alert('❌ فشل النسخ'));
                    return;
                default:
                    return;
            }
            window.open(shareUrl, '_blank', 'width=600,height=500');
        };

        // === زر المعاينة ===
        document.getElementById('previewBtn').addEventListener('click', showPreview);

        // === زر المنشورات ===
        document.getElementById('listBtn').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/list-posts');
                const data = await res.json();
                if (data.success && data.files && data.files.length > 0) {
                    const posts = data.files.map(f => f.replace('.txt', '')).join('\n• ');
                    setStatus(`📂 المنشورات المحفوظة:\n• ${posts}`, 'success');
                } else {
                    setStatus('📭 لا توجد منشورات محفوظة.', 'error');
                }
            } catch (err) {
                setStatus('❌ فشل جلب القائمة.', 'error');
            }
        });

        // === إرسال النموذج (نشر) ===
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = titleInput.value.trim();
            const content = contentInput.value.trim();

            if (!title || !content) {
                setStatus('⚠️ الرجاء ملء العنوان والمحتوى.', 'error');
                return;
            }

            setStatus('⏳ جاري النشر...', 'loading');

            try {
                const response = await fetch('/api/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });

                const data = await response.json();

                if (data.success) {
                    setStatus('✅ تم النشر بنجاح!', 'success');
                    viewPostLink.innerHTML = `
                        <a href="${data.url || '#'}" target="_blank">🔗 عرض المنشور على GitHub</a>
                    `;
                    showPreview();
                    shareOptions.classList.add('show');
                } else {
                    setStatus('❌ حدث خطأ: ' + (data.error || 'غير معروف'), 'error');
                }
            } catch (err) {
                setStatus('❌ فشل الاتصال بالخادم.', 'error');
                console.error('Fetch error:', err);
            }
        });

        // معاينة تلقائية (اختياري - فعّل بإزالة التعليق)
        // titleInput.addEventListener('input', showPreview);
        // contentInput.addEventListener('input', showPreview);
    })();
</script>

</body>
</html>
