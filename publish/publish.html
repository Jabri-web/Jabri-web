<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشر منشور جديد | واحة الجبري</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #f4f0e9; font-family: 'Arial', sans-serif; direction: rtl; padding: 20px; margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 700px; width: 100%; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-top: 6px solid #8b0000; }
        h2 { color: #8b0000; font-size: 24px; margin-top: 0; margin-bottom: 20px; text-align: center; }
        label { font-weight: bold; color: #333; display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0 15px 0; border: 2px solid #e0d6c8; border-radius: 10px; font-size: 16px; background: #fcfaf7; }
        input:focus, textarea:focus { border-color: #8b0000; outline: none; background: #fff; }
        textarea { resize: vertical; min-height: 150px; }
        .button-group { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
        .btn-primary { background: #8b0000; color: white; padding: 14px 30px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; flex: 1; }
        .btn-secondary { background: #2c3e50; color: white; padding: 14px 30px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; flex: 1; }
        #status { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; display: none; white-space: pre-wrap; }
        #status.show { display: block; }
        #status.success { background: #e6f7e6; color: #2d7a2d; }
        #status.error { background: #fde8e8; color: #8b0000; }
        #status.loading { background: #f0f0f0; color: #555; }
        #shareOptions { display: none; margin-top: 20px; padding: 15px; background: #f9f6f0; border-radius: 12px; border: 2px solid #8b0000; }
        #shareOptions.show { display: block; }
        .share-btn { border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; color: white; margin: 5px; }
        .share-btn.whatsapp { background: #25D366; }
        .share-btn.twitter { background: #1DA1F2; }
        .share-btn.copy { background: #6c757d; }
    </style>
</head>
<body>
<div class="container">
    <h2>✍️ نشر منشور جديد</h2>
    <form id="publishForm">
        <label for="title">العنوان</label>
        <input type="text" id="title" placeholder="اكتب عنوان المنشور..." required>
        <label for="content">المحتوى</label>
        <textarea id="content" rows="8" placeholder="اكتب نص المنشور هنا..." required></textarea>
        <div class="button-group">
            <button type="submit" class="btn-primary">📤 نشر</button>
            <button type="button" id="previewBtn" class="btn-secondary">👁️ عرض</button>
            <button type="button" id="listBtn" class="btn-secondary">📂 المنشورات</button>
        </div>
    </form>
    <div id="status"></div>
    <div id="shareOptions">
        <h4>🌐 اختر منصة النشر:</h4>
        <button class="share-btn whatsapp" onclick="shareTo('whatsapp')">📱 واتساب</button>
        <button class="share-btn twitter" onclick="shareTo('twitter')">🐦 تويتر</button>
        <button class="share-btn copy" onclick="shareTo('copy')">📋 نسخ</button>
    </div>
</div>

<script>
    const form = document.getElementById('publishForm');
    const titleInput = document.getElementById('title');
    const contentInput = document.getElementById('content');
    const statusDiv = document.getElementById('status');

    function setStatus(message, type) {
        statusDiv.textContent = message;
        statusDiv.className = 'show ' + type;
    }

    // === زر المنشورات - نسخة تصحيح مؤقتة ===
    document.getElementById('listBtn').addEventListener('click', async () => {
        try {
            setStatus('⏳ جاري التحقق من الخادم...', 'loading');
            const res = await fetch('/api/list-posts');
            if(!res.ok) throw new Error(res.status + ' ' + res.statusText);
            const data = await res.json();
            if (data.success && data.files && data.files.length > 0) {
                let list = '📂 المنشورات المحفوظة:\n\n';
                data.files.forEach((file, index) => {
                    list += `${index + 1}. ${file.name.replace('.txt', '')}\n   🔗 ${file.url}\n\n`;
                });
                setStatus(list, 'success');
            } else {
                setStatus('📭 لا توجد منشورات محفوظة.', 'error');
            }
        } catch (err) {
            setStatus('❌ الخادم غير متاح: ' + err.message + '\nتأكد ان /api/list-posts.js موجود', 'error');
        }
    });

    // === نشر ===
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = titleInput.value.trim();
        const content = contentInput.value.trim();
        if (!title || !content) return setStatus('⚠️ الرجاء ملء العنوان والمحتوى.', 'error');
        
        setStatus('⏳ جاري النشر...', 'loading');
        try {
            const response = await fetch('/api/publish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content })
            });
            const data = await response.json();
            if (data.success) {
                setStatus('✅ تم النشر بنجاح!', 'success');
                document.getElementById('shareOptions').classList.add('show');
            } else {
                setStatus('❌ حدث خطأ: ' + (data.error || 'غير معروف'), 'error');
            }
        } catch (err) {
            setStatus('❌ فشل الاتصال بالخادم. تأكد ان /api/publish.js موجود', 'error');
        }
    });

    window.shareTo = function(platform) {
        const text = `${titleInput.value}\n\n${contentInput.value}\n\n#عبدالله_الجبري #فلسطين_عربية`;
        const url = 'https://jabri-com.vercel.app';
        let shareUrl = '';
        if(platform==='whatsapp') shareUrl = `https://wa.me/?text=${encodeURIComponent(text + '\n' + url)}`;
        if(platform==='twitter') shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
        if(platform==='copy') { navigator.clipboard.writeText(text); alert('✅ تم النسخ'); return; }
        window.open(shareUrl, '_blank');
    };
</script>
</body>
</html>
