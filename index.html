<meta charset="UTF-8">
<title>الجمهورية اليمنية</title>
<script>
const X = window.location.origin;
const Y = window.location.pathname.split('/').filter(p => p && p!== 'index.html')[0] || '';

// If x=https://Jabri-web.github.io/ → روح Sindbad.html
if(X === 'https://Jabri-web.github.io' || X === 'https://Jabri-web.github.io/' || Y === '') {
  window.location.replace(X + '/Sindbad.html');
}
else {
  // باقي الريبو يحول حسب Y
  if(Y.includes('Jabri62018')) window.location.replace(X + '/Yemen-sindbad.html');
  else if(Y.includes('Zx_RieOS_v1.2')) window.location.replace(X + '/Yemen-bird.html');
  else if(Y.includes('Zx_Mother_Function_Jabri')) window.location.replace(X + '/Yemen-Ankboot.html');
}
</script>
</head>
