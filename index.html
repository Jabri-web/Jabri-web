<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yemen Sindbad</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma;background:linear-gradient(135deg,#0d1b2a,#1b263b);color:#eee;min-height:100vh}
.header{padding:5vh 0;text-align:center;background:rgba(0,0,0,0.3)}
.header img{width:90px;height:90px;border-radius:50%;border:4px solid #e94560;margin-bottom:2vh}
.header h1{font-size:26px;color:#e94560;margin:1vh 0}
.container{max-width:600px;margin:5vh auto;padding:0 6vw}
.btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:3vh 5vw;margin:2vh 0;background:rgba(255,255,255,0.05);border:2px solid #e94560;border-radius:18px;color:#eee;text-decoration:none;font-size:18px;font-weight:bold}
.btn:hover{background:#e94560;color:white}
.btn-green{border-color:#2ecc71}
.btn-blue{border-color:#3498db}
.btn-red{border-color:#e74c3c}
.footer{text-align:center;padding:4vh;font-size:12px;color:#aaa}
</style>

<!-- Router عام 100% - يقرأ Config.js -->
<script src="./Config.js"></script>
<script>
// Router عام يطابق الأسماء اللي في الريبو بالضبط
const PAGES = {
  'sindbad': 'Sindbad.html',           // عندك Sindbad.html
  'yemen-sindbad': 'Yemen-Sindbad.html', // عندك Yemen-Sindbad.html 
  'yemen-bird': 'Yemen-bird.html',     // عندك Yemen-bird.html
  'yemen-ankboot': 'Yemen-Ankboot.html', // عندك Yemen-Ankboot.html
  'pages-researches': 'Pages-Researches.html', // عندك Pages-Researches.html
  'yemen-library': 'Yemen-library.html'  // عندك Yemen-library.html
};

function go(key){
  const file = PAGES[key.toLowerCase()];
  if(file){
    // المسار الذكي + اسم الملف المطابق 100%
    const base = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '');
    window.location.href = base + '/' + file;
  } else {
    alert('الصفحة غير موجودة: ' + key);
  }
}

function exitApp(){
  if(window.history.length > 1) window.history.back();
  else alert('اغلق الصفحة يدوياً');
}

// نعرض اللوجو من Config.js عشان حرف L كبير
window.addEventListener('load', ()=>{
  if(typeof CFG !== 'undefined'){
    document.getElementById('logo').src = CFG.logo;
  }
});
</script>
</head>
<body>

<div class="header">
  <img id="logo" src="./Logo.png" alt="Logo"> <!-- L كبير زي الريبو -->
  <h1>Yemen Sindbad</h1>
  <p>الجمهورية اليمنية - Republic of Yemen</p>
</div>

<div class="container">
  
  <a href="javascript:go('yemen-sindbad')" class="btn">
    <span>Yemen Sindbad</span>
    <span>سندباد اليمن</span>
  </a>
  
  <a href="javascript:go('yemen-bird')" class="btn btn-green">
    <span>Yemen Bird</span>
    <span>طائر اليمن</span>
  </a>
  
  <a href="javascript:go('yemen-ankboot')" class="btn btn-blue">
    <span>Yemen Ankboot</span>
    <span>عنكبوت اليمن</span>
  </a>
  
  <a href="javascript:go('pages-researches')" class="btn">
    <span>Pages A2 Researches3</span>
    <span>البحوث</span>
  </a>
  
  <a href="javascript:go('yemen-library')" class="btn">
    <span>My Library</span>
    <span>مكتبتي</span>
  </a>
  
  <a href="javascript:exitApp()" class="btn btn-red">
    <span>Exit</span>
    <span>قفل</span>
  </a>
  
</div>

<div class="footer">
  © Yemen Sindbad 2025<br>
  <small>صنع بيد يمنية 🇾🇪 | Eng. Abdulla al-Jabri</small>
</div>

</body>
</html>
