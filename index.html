<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سندباد اليمن - البوابة العامة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">
<style>
* {box-sizing:border-box}
body {margin:0; padding:15px; font-family:'Cairo',Tahoma,sans-serif; background:#f5f7fa; color:#000}
header {
  background:linear-gradient(135deg,#0a3d62,#1e6f9f); color:white; text-align:center;
  padding:25px 10px; border-radius:15px; margin-bottom:20px
}
header img {
  width:80px; height:80px; border-radius:50%; border:3px solid #00ff88;
  display:block; margin:0 auto 15px; object-fit:cover
}
h2 {text-align:center; color:#0a3d62; margin:20px 0 10px; font-size:22px}
.group {margin:20px 0; padding:15px; background:white; border-radius:12px; border:2px solid #ddd}
.group-title {font-size:18px; font-weight:bold; color:#c62828; text-align:center; margin-bottom:12px}
.repo-btn {
  display:flex; justify-content:space-between; align-items:center;
  width:100%; margin:10px 0; padding:18px;
  background:#000; color:#fff; font-size:16px; font-weight:bold;
  border-radius:12px; text-decoration:none; transition:0.3s; border:2px solid #000
}
.repo-btn:hover {background:linear-gradient(135deg,#00ffc8,#00b894); border-color:#00ffc8}
.current-btn {
  background:linear-gradient(135deg,#ff6b6b,#c62828); border-color:#ff6b6b;
  animation: pulse 2s infinite
}
@keyframes pulse {0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,0.4)} 50%{box-shadow:0 0 0 12px rgba(255,107,107,0)}}
.hidden {display:none!important}
footer {background:#0a3d62; color:white; text-align:center; padding:15px; margin-top:25px; border-radius:12px; font-size:14px}
</style>
</head>
<body>

<header>
<img src="Yemen-bird.png" alt="طائر اليمن">
<h1 style="margin:0; font-size:24px">Republic of Yemen</h1>
<p style="margin:5px 0 0 0; opacity:0.9">Z + C + A = 1 | Riemann zeta & Cosmology</p>
</header>

<h2>👁️ سندباد اليمن - البوابة العامة 1→10 👁️</h2>
<p style="text-align:center; color:#555; font-weight:bold; margin-bottom:20px">م/عبدالله الجبري</p>

<!-- زر الصفحة الحالية -->
<a id="current-page-btn" href="#" class="repo-btn current-btn hidden">جاري الكشف...</a>

<!-- 1-10 -->
<div class="group">
<div class="group-title">المشاريع الأساسية 1→10</div>
<div id="repos-1-10"></div>
</div>

<footer>
<p style="margin:5px">© 2026 Yemen Sindbad - جميع الحقوق محفوظة</p>
<p style="margin:5px">صنع بحب في اليمن 🇾🇪</p>
</footer>

<script>
try {
  const path = window.location.pathname;
  let currentPage = "index";

  if(path.includes("page1")) currentPage = "page1";
  else if(path.includes("page2")) currentPage = "page2";
  else if(path.includes("page3")) currentPage = "page3";
  else if(path.includes("page4")) currentPage = "page4";
  else if(path.includes("page5")) currentPage = "page5";
  else if(path.includes("page6")) currentPage = "page6";
  else if(path.includes("page7")) currentPage = "page7";
  else if(path.includes("page8")) currentPage = "page8";
  else if(path.includes("page9")) currentPage = "page9";
  else if(path.includes("page10")) currentPage = "page10";

  const pages = {
    "page1": {id:1, name:"سندباد اليمن", url:"page1.html"},
    "page2": {id:2, name:"طائر اليمن", url:"page2.html"},
    "page3": {id:3, name:"عنكبوت اليمن", url:"page3.html"},
    "page4": {id:4, name:"البوابة الرئيسية", url:"index.html"},
    "page5": {id:5, name:"أرشيف نوبل", url:"page5.html"},
    "page6": {id:6, name:"مختبر الجبري", url:"page6.html"},
    "page7": {id:7, name:"RieOS v1.1", url:"page7.html"},
    "page8": {id:8, name:"RiemannOS", url:"page8.html"},
    "page9": {id:9, name:"Jabri Checkout", url:"page9.html"},
    "page10": {id:10, name:"Jabri-web", url:"page10.html"}
  };

  const btn = document.getElementById('current-page-btn');

  if(currentPage!== "index" && pages[currentPage]) {
    btn.classList.remove('hidden');
    btn.href = pages[currentPage].url;
    btn.innerHTML = `<span style="flex:1;text-align:right">📍 ${pages[currentPage].name} - الصفحة الحالية</span><span style="font-size:20px">${pages[currentPage].id}</span>`;
  }

  const container = document.getElementById('repos-1-10');
  for(let i=1; i<=10; i++) {
    const key = Object.keys(pages).find(k => pages[k].id === i);
    if(key && key!== currentPage) {
      const p = pages[key];
      const a = document.createElement('a');
      a.href = p.url;
      a.className = "repo-btn";
      a.innerHTML = `<span style="flex:1;text-align:right">${p.name}</span><span style="font-size:20px;opacity:0.9">${p.id}</span>`;
      container.appendChild(a);
    }
  }
} catch(e) {console.error(e)}
</script>

</body>
</html>
