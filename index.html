<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yemen Sindbad</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma;background:linear-gradient(135deg,#0d1b2a,#1b263b);color:#eee;min-height:100vh}
.header{padding:5vh 0;text-align:center;background:rgba(0,0,0,0.3)}
.header img{width:70px;height:70px;border-radius:15px;border:3px solid #e94560;margin-bottom:1vh}
.header h1{font-size:26px;color:#e94560;margin:1vh 0}
.container{max-width:600px;margin:5vh auto;padding:0 6vw}
.btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:3vh 5vw;margin:2vh 0;background:rgba(255,255,255,0.05);border:2px solid #e94560;border-radius:18px;color:#eee;text-decoration:none;font-size:18px;font-weight:bold;cursor:pointer}
.btn:hover{background:#e94560;color:white}
.btn-green{border-color:#2ecc71}
.btn-blue{border-color:#3498db}
.btn-red{border-color:#e74c3c}
.footer{text-align:center;padding:4vh;font-size:12px;color:#aaa}
</style>

<script src="./Config.js"></script>
<script>
window.addEventListener('load', ()=>{
  if(typeof CFG!== 'undefined'){
    document.getElementById('logo').src = CFG.logo;
    const container = document.getElementById('menu');
    const colors = ['btn', 'btn-green', 'btn-blue', '', 'btn-red'];
    let i = 0;
    for(let key in CFG.PAGES){
      const page = CFG.PAGES[key];
      const color = colors[i] || 'btn';
      const btn = document.createElement('a');
      btn.className = 'btn ' + color;
      btn.href = 'javascript:CFG.go("' + key + '")';
      btn.innerHTML = `<span>${page.en}</span><span>${page.ar}</span>`;
      container.appendChild(btn);
      i++;
    }
  }
});
</script>
</head>
<body>

<div class="header">
  <img id="logo" src="./Logo.png" alt="Logo">
  <h1>Yemen Sindbad</h1>
  <p>الجمهورية اليمنية - Republic of Yemen</p>
</div>

<div class="container" id="menu">
  <a href="javascript:CFG.exit()" class="btn btn-red">
    <span>Exit</span>
    <span>قفل</span>
  </a>
</div>

<div class="footer">
  © Yemen Sindbad 2025<br>
  <small>صنع بيد يمنية 🇾🇪 | Eng. Abdulla al-Jabri</small>
</div>

</body>
</html>
